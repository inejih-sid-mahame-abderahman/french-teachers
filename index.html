<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concours : Professeur Principal de Français - 300+ Questions</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1e3a8a;
    --primary-dark:#1e2a5a;
    --accent:#f59e0b;
    --accent-dark:#d97706;
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#1c2b2d;
    --muted:#5f7470;
    --success:#16a34a;
    --success-bg:#e6f6ec;
    --error:#dc2626;
    --error-bg:#fdeaea;
    --border:#dbe4f0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.8;
    padding:20px;
  }
  .container{max-width:960px;margin:0 auto;}
  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:#fff;border-radius:18px;padding:30px 25px;text-align:center;
    box-shadow:0 10px 30px rgba(30,58,138,.25);margin-bottom:22px;
    position:relative;overflow:hidden;
  }
  header::before{
    content:"";position:absolute;top:-50%;right:-20%;
    width:300px;height:300px;
    background:radial-gradient(circle,rgba(245,158,11,.25),transparent 70%);
    border-radius:50%;
  }
  header h1{font-size:1.8rem;font-weight:900;margin-bottom:8px;position:relative;}
  header p{color:#cfe0f5;font-size:1rem;position:relative;}
  .badge{
    display:inline-block;background:var(--accent);color:#3b2c00;
    font-weight:700;padding:4px 14px;border-radius:30px;
    font-size:.85rem;margin-top:12px;position:relative;
  }
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:14px;margin-bottom:22px;
  }
  .stat-card{
    background:var(--card);border-radius:14px;padding:18px 12px;
    text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05);
    border:1px solid var(--border);transition:transform .2s;
  }
  .stat-card:hover{transform:translateY(-3px);}
  .stat-card .num{font-size:1.7rem;font-weight:900;color:var(--primary);display:block;}
  .stat-card .lbl{font-size:.85rem;color:var(--muted);font-weight:600;}
  .progress-wrap{
    background:var(--card);border-radius:14px;padding:18px 20px;
    box-shadow:0 4px 14px rgba(0,0,0,.05);border:1px solid var(--border);
    margin-bottom:22px;
  }
  .progress-top{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:10px;}
  .progress-bar{height:12px;background:#e8eef6;border-radius:20px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#3b82f6);border-radius:20px;transition:width .4s ease;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;justify-content:center;}
  .btn{font-family:'Cairo',sans-serif;border:none;padding:12px 26px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(30,58,138,.3);}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);}
  .btn-accent{background:var(--accent);color:#3b2c00;box-shadow:0 4px 14px rgba(245,158,11,.35);}
  .btn-accent:hover{background:var(--accent-dark);transform:translateY(-2px);}
  .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}
  .btn-outline:hover{background:#eaf0fb;}
  .quiz-section{display:none;}
  .quiz-section.active{display:block;}
  .question-card{
    background:var(--card);border-radius:16px;padding:24px 22px;
    box-shadow:0 6px 20px rgba(0,0,0,.06);border:1px solid var(--border);
    margin-bottom:18px;animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .q-num{background:var(--primary);color:#fff;font-weight:700;padding:4px 14px;border-radius:20px;font-size:.85rem;}
  .q-tag{background:#eef2fa;color:var(--primary);font-weight:600;padding:4px 12px;border-radius:20px;font-size:.78rem;}
  .q-text{font-size:1.15rem;font-weight:700;line-height:1.9;margin-bottom:18px;color:var(--text);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;background:#fafcff;
    border:2px solid var(--border);border-radius:12px;padding:12px 16px;
    cursor:pointer;transition:all .2s;font-size:1rem;
  }
  .option:hover{border-color:var(--primary);background:#eff5ff;}
  .option.selected{border-color:var(--primary);background:#e0ecff;}
  .option.correct{border-color:var(--success);background:var(--success-bg);}
  .option.wrong{border-color:var(--error);background:var(--error-bg);}
  .option .letter{
    width:28px;height:28px;flex-shrink:0;border-radius:50%;
    background:var(--primary);color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:.85rem;
  }
  .option.correct .letter{background:var(--success);}
  .option.wrong .letter{background:var(--error);}
  .explanation{
    margin-top:14px;padding:14px 16px;background:#fffbe9;
    border-left:4px solid var(--accent);border-radius:8px;
    font-size:.92rem;display:none;
  }
  .explanation.show{display:block;}
  .nav-buttons{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
  .result-card{
    background:var(--card);border-radius:18px;padding:40px 28px;
    text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08);
    border:1px solid var(--border);
  }
  .result-circle{
    width:170px;height:170px;border-radius:50%;margin:0 auto 22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:conic-gradient(var(--primary) 0deg, #e8eef6 0deg);position:relative;
  }
  .result-circle::before{content:"";position:absolute;inset:12px;background:#fff;border-radius:50%;}
  .result-circle .pct{font-size:2.4rem;font-weight:900;color:var(--primary);position:relative;z-index:1;}
  .result-circle .pct-lbl{font-size:.8rem;color:var(--muted);position:relative;z-index:1;}
  .result-msg{font-size:1.3rem;font-weight:700;margin-bottom:10px;}
  .result-sub{color:var(--muted);margin-bottom:24px;}
  .sections-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
  .section-card{
    background:var(--card);border:2px solid var(--border);border-radius:14px;
    padding:18px;text-align:center;cursor:pointer;transition:all .2s;
  }
  .section-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.07);}
  .section-card.active{border-color:var(--primary);background:#e0ecff;}
  .section-card .icon{font-size:1.8rem;margin-bottom:8px;}
  .section-card .name{font-weight:700;font-size:.95rem;}
  .section-card .count{font-size:.78rem;color:var(--muted);}
  @media(max-width:600px){
    body{padding:12px;}
    header h1{font-size:1.3rem;}
    .q-text{font-size:1rem;}
    .stat-card .num{font-size:1.3rem;}
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>🎓 Concours : Professeur Principal de Français</h1>
    <p>Préparation intensive – Mathématiques · Sciences · Français</p>
    <span class="badge">300+ Questions à choix multiples</span>
  </header>

  <div class="stats">
    <div class="stat-card"><span class="num" id="statTotal">0</span><span class="lbl">Total Questions</span></div>
    <div class="stat-card"><span class="num" id="statAnswered">0</span><span class="lbl">Répondues</span></div>
    <div class="stat-card"><span class="num" id="statCorrect" style="color:var(--success)">0</span><span class="lbl">Correctes</span></div>
    <div class="stat-card"><span class="num" id="statWrong" style="color:var(--error)">0</span><span class="lbl">Fausses</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span>📊 Progression</span>
      <span id="progressText">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="sections-grid" id="sectionsGrid"></div>

  <div class="controls">
    <button class="btn btn-primary" onclick="startQuiz('all')">🚀 Examen complet</button>
    <button class="btn btn-accent" onclick="startQuiz('random')">🎲 Quiz aléatoire (50)</button>
    <button class="btn btn-outline" onclick="resetQuiz()">🔄 Réinitialiser</button>
  </div>

  <div id="quizArea" class="quiz-section"></div>

</div>

<script>
const QUESTIONS = [

/* ============================================================
   MATHÉMATIQUES (180 questions) - FOCUS PRINCIPAL
   ============================================================ */

/* --- Nombres et opérations (30) --- */
{cat:"Mathématiques",q:"Quel est le résultat de 25 × 4 + 30 ÷ 6 ?",opts:["105","110","115","120"],a:0,exp:"25×4 = 100 ; 30÷6 = 5 ; 100+5 = 105."},
{cat:"Mathématiques",q:"Quel est le PGCD de 48 et 60 ?",opts:["6","12","18","24"],a:1,exp:"PGCD(48,60) = 12."},
{cat:"Mathématiques",q:"Quel est le PPCM de 12 et 18 ?",opts:["36","24","48","72"],a:0,exp:"PPCM(12,18) = 36."},
{cat:"Mathématiques",q:"Combien vaut 3⁴ ?",opts:["27","64","81","12"],a:2,exp:"3⁴ = 3×3×3×3 = 81."},
{cat:"Mathématiques",q:"Quelle est la valeur de √169 ?",opts:["11","12","13","14"],a:2,exp:"√169 = 13."},
{cat:"Mathématiques",q:"Quel est le résultat de 7/8 + 5/8 ?",opts:["12/16","12/8","3/2","1"],a:1,exp:"7/8 + 5/8 = 12/8 = 3/2."},
{cat:"Mathématiques",q:"Combien vaut 0,25 sous forme de fraction ?",opts:["1/2","1/3","1/4","1/5"],a:2,exp:"0,25 = 1/4."},
{cat:"Mathématiques",q:"Quel nombre est premier ?",opts:["21","27","29","33"],a:2,exp:"29 est premier."},
{cat:"Mathématiques",q:"Quel est le résultat de 8² - 4² ?",opts:["16","32","48","64"],a:2,exp:"8²-4² = 64-16 = 48."},
{cat:"Mathématiques",q:"Combien font 15 % de 200 ?",opts:["20","25","30","35"],a:2,exp:"200×15/100 = 30."},
{cat:"Mathématiques",q:"Écrire 0,00045 en notation scientifique :",opts:["4,5×10⁻³","4,5×10⁻⁴","4,5×10⁻⁵","45×10⁻⁵"],a:1,exp:"4,5×10⁻⁴."},
{cat:"Mathématiques",q:"Quel est l'inverse de 5/3 ?",opts:["-5/3","3/5","-3/5","1"],a:1,exp:"Inverse de 5/3 = 3/5."},
{cat:"Mathématiques",q:"Quelle est la valeur absolue de -17 ?",opts:["-17","0","17","1/17"],a:2,exp:"|−17| = 17."},
{cat:"Mathématiques",q:"Combien vaut (2/3)² ?",opts:["4/9","2/9","4/6","2/6"],a:0,exp:"(2/3)² = 4/9."},
{cat:"Mathématiques",q:"Le nombre 1 est-il premier ?",opts:["Oui","Non","Parfois","Cela dépend"],a:1,exp:"Non, 1 n'est pas premier."},
{cat:"Mathématiques",q:"Quelle est la décomposition en facteurs premiers de 60 ?",opts:["2²×3×5","2×3²×5","2²×3²×5","2³×3×5"],a:0,exp:"60 = 2²×3×5."},
{cat:"Mathématiques",q:"Que vaut 5! (factorielle 5) ?",opts:["25","60","120","720"],a:2,exp:"5! = 120."},
{cat:"Mathématiques",q:"Combien font 3/4 × 8/9 ?",opts:["2/3","1/2","3/5","5/6"],a:0,exp:"3/4 × 8/9 = 24/36 = 2/3."},
{cat:"Mathématiques",q:"Quel est le carré de 0,5 ?",opts:["0,25","0,5","1","2,5"],a:0,exp:"0,5² = 0,25."},
{cat:"Mathématiques",q:"Quel est le cube de 3 ?",opts:["9","27","81","243"],a:1,exp:"3³ = 27."},
{cat:"Mathématiques",q:"Quel est le résultat de (-3) + (-7) ?",opts:["-10","10","-4","4"],a:0,exp:"(-3)+(-7) = -10."},
{cat:"Mathématiques",q:"(-2) × (-5) × (-1) = ?",opts:["10","-10","-7","7"],a:1,exp:"(-2)×(-5)=10 ; 10×(-1)=-10."},
{cat:"Mathématiques",q:"Quel est le résultat de 100 ÷ (-4) ?",opts:["25","-25","-40","40"],a:1,exp:"100 ÷ (-4) = -25."},
{cat:"Mathématiques",q:"Combien vaut 2⁻³ ?",opts:["-8","-6","1/8","1/6"],a:2,exp:"2⁻³ = 1/2³ = 1/8."},
{cat:"Mathématiques",q:"Quel est l'arrondi au dixième de 4,678 ?",opts:["4,6","4,7","4,68","5"],a:1,exp:"4,7."},
{cat:"Mathématiques",q:"Combien font 3,5 + 2,75 ?",opts:["5,25","6","6,25","6,75"],a:2,exp:"3,50+2,75 = 6,25."},
{cat:"Mathématiques",q:"Quel est le reste de la division 47 par 5 ?",opts:["1","2","3","4"],a:1,exp:"47 = 9×5 + 2."},
{cat:"Mathématiques",q:"Combien y a-t-il de diviseurs de 12 ?",opts:["4","5","6","8"],a:2,exp:"1,2,3,4,6,12 → 6 diviseurs."},
{cat:"Mathématiques",q:"Quel est le résultat de 6 × (4 + 3) ?",opts:["24","42","18","30"],a:1,exp:"6×(7) = 42."},
{cat:"Mathématiques",q:"Quelle est la valeur de π arrondie au centième ?",opts:["3,14","3,15","3,13","3,16"],a:0,exp:"π ≈ 3,14."},

/* --- Algèbre (30) --- */
{cat:"Mathématiques",q:"Résoudre : 2x + 5 = 13",opts:["x=3","x=4","x=5","x=9"],a:1,exp:"2x = 8 → x = 4."},
{cat:"Mathématiques",q:"Résoudre : 3x - 7 = 8",opts:["x=3","x=5","x=7","x=15"],a:1,exp:"3x = 15 → x = 5."},
{cat:"Mathématiques",q:"Développer (x+3)² :",opts:["x²+9","x²+6x+9","x²+3x+9","x²+6x"],a:1,exp:"(x+3)² = x²+6x+9."},
{cat:"Mathématiques",q:"Factoriser x² - 9 :",opts:["(x-3)(x-3)","(x+3)(x+3)","(x-3)(x+3)","x(x-9)"],a:2,exp:"x²-9 = (x-3)(x+3)."},
{cat:"Mathématiques",q:"Développer (2x-1)(x+4) :",opts:["2x²+7x-4","2x²+8x-4","2x²-7x-4","2x²+7x+4"],a:0,exp:"2x²+8x-x-4 = 2x²+7x-4."},
{cat:"Mathématiques",q:"Résoudre x² = 25 :",opts:["x=5","x=-5","x=5 ou x=-5","x=0"],a:2,exp:"x = ±5."},
{cat:"Mathématiques",q:"Résoudre : 5x - 2 = 3x + 6",opts:["x=2","x=4","x=3","x=1"],a:1,exp:"2x = 8 → x = 4."},
{cat:"Mathématiques",q:"Quelle est la forme canonique de x² - 4x + 3 ?",opts:["(x-2)²-1","(x-2)²+1","(x+2)²-1","(x-2)²-3"],a:0,exp:"x²-4x+3 = (x-2)²-1."},
{cat:"Mathématiques",q:"Résoudre x² - 5x + 6 = 0",opts:["x=1 ou 6","x=2 ou 3","x=-2 ou -3","x=0 ou 5"],a:1,exp:"x=2 ou x=3."},
{cat:"Mathématiques",q:"Simplifier : (x³)²",opts:["x⁵","x⁶","x⁹","x"],a:1,exp:"(x³)² = x⁶."},
{cat:"Mathématiques",q:"Quel est le discriminant de x² - 4x + 3 ?",opts:["2","4","8","16"],a:1,exp:"Δ = 16-12 = 4."},
{cat:"Mathématiques",q:"Si f(x) = 2x+1, que vaut f(3) ?",opts:["5","6","7","8"],a:2,exp:"f(3) = 2×3+1 = 7."},
{cat:"Mathématiques",q:"Si f(x) = x², que vaut f(-3) ?",opts:["-9","9","-6","6"],a:1,exp:"(-3)² = 9."},
{cat:"Mathématiques",q:"Résoudre : x/3 = 4",opts:["x=1","x=7","x=12","x=3/4"],a:2,exp:"x = 12."},
{cat:"Mathématiques",q:"Développer 3(x+2) :",opts:["3x+2","3x+5","3x+6","3x+32"],a:2,exp:"3x+6."},
{cat:"Mathématiques",q:"Factoriser 4x + 8 :",opts:["4(x+2)","4(x+8)","2(2x+8)","8(x+1)"],a:0,exp:"4(x+2)."},
{cat:"Mathématiques",q:"Résoudre : 2(x+3) = 10",opts:["x=1","x=2","x=3","x=4"],a:1,exp:"x+3=5 → x=2."},
{cat:"Mathématiques",q:"Quelle est l'équation de la droite passant par A(0,2) de pente 3 ?",opts:["y=2x+3","y=3x+2","y=3x-2","y=-3x+2"],a:1,exp:"y = 3x+2."},
{cat:"Mathématiques",q:"Le point (2,5) appartient-il à y = 2x+1 ?",opts:["Oui","Non","Peut-être","Impossible de savoir"],a:0,exp:"2×2+1 = 5. Oui."},
{cat:"Mathématiques",q:"Résoudre le système : x+y=10 ; x-y=4",opts:["x=6,y=4","x=7,y=3","x=5,y=5","x=8,y=2"],a:1,exp:"2x=14→x=7; y=3."},
{cat:"Mathématiques",q:"Quelle est la valeur de x dans : 5x = 3x + 10 ?",opts:["x=3","x=4","x=5","x=10"],a:2,exp:"2x=10 → x=5."},
{cat:"Mathématiques",q:"Simplifier : 2x + 3x - x :",opts:["4x","5x","6x","2x"],a:0,exp:"2+3-1 = 4."},
{cat:"Mathématiques",q:"Résoudre : x² = 3x",opts:["x=0 ou 3","x=3","x=0","x=1 ou 3"],a:0,exp:"x(x-3)=0."},
{cat:"Mathématiques",q:"Développer (a+b)(a-b) :",opts:["a²+b²","a²-b²","a²+2ab+b²","a²-2ab+b²"],a:1,exp:"a²-b²."},
{cat:"Mathématiques",q:"Le coefficient directeur de y = -2x+1 est :",opts:["2","-2","1","-1"],a:1,exp:"-2."},
{cat:"Mathématiques",q:"Combien vaut f(0) si f(x) = 3x² + 1 ?",opts:["0","1","3","4"],a:1,exp:"f(0)=1."},
{cat:"Mathématiques",q:"Résoudre : |x| = 7",opts:["x=7","x=-7","x=7 ou x=-7","Impossible"],a:2,exp:"x=±7."},
{cat:"Mathématiques",q:"Développer : (x+1)³",opts:["x³+1","x³+3x²+3x+1","x³+3x+1","x³+6x²+1"],a:1,exp:"Identité remarquable."},
{cat:"Mathématiques",q:"Résoudre : 7 - 2x = 1",opts:["x=2","x=3","x=4","x=6"],a:1,exp:"2x=6 → x=3."},
{cat:"Mathématiques",q:"Factoriser x² + 6x + 9 :",opts:["(x+3)²","(x+3)(x-3)","(x+9)(x+1)","x(x+6)+9"],a:0,exp:"(x+3)²."},

/* --- Géométrie (35) --- */
{cat:"Mathématiques",q:"Quelle est l'aire d'un carré de côté 5 cm ?",opts:["10 cm²","20 cm²","25 cm²","30 cm²"],a:2,exp:"Aire = c² = 25 cm²."},
{cat:"Mathématiques",q:"Quel est le périmètre d'un rectangle 8×5 ?",opts:["13","26","40","80"],a:1,exp:"P = 2(8+5) = 26."},
{cat:"Mathématiques",q:"L'aire d'un triangle de base 6 et de hauteur 4 :",opts:["10","12","24","48"],a:1,exp:"A = b×h/2 = 12."},
{cat:"Mathématiques",q:"Dans un triangle rectangle, le théorème de Pythagore s'écrit :",opts:["a+b=c","a²+b²=c²","a²-b²=c²","ab=c"],a:1,exp:"a²+b²=c²."},
{cat:"Mathématiques",q:"Un triangle avec les côtés 3, 4, 5 est :",opts:["Isocèle","Rectangle","Équilatéral","Quelconque"],a:1,exp:"3²+4²=5² → rectangle."},
{cat:"Mathématiques",q:"Quelle est la somme des angles d'un triangle ?",opts:["90°","180°","270°","360°"],a:1,exp:"180°."},
{cat:"Mathématiques",q:"La circonférence d'un cercle de rayon 3 cm (π≈3,14) :",opts:["9,42","18,84","28,26","6,28"],a:1,exp:"C = 2πr = 18,84."},
{cat:"Mathématiques",q:"L'aire d'un cercle de rayon 5 cm :",opts:["25π","10π","5π","50π"],a:0,exp:"A = πr² = 25π."},
{cat:"Mathématiques",q:"Le volume d'un cube d'arête 4 cm :",opts:["12","16","48","64"],a:3,exp:"V = 4³ = 64."},
{cat:"Mathématiques",q:"Le volume d'un cylindre :",opts:["πr²h","πrh","2πr²","πr²/2"],a:0,exp:"V = πr²h."},
{cat:"Mathématiques",q:"Un angle de 90° est :",opts:["Aigu","Droit","Obtus","Plat"],a:1,exp:"Droit."},
{cat:"Mathématiques",q:"Un angle de 120° est :",opts:["Aigu","Droit","Obtus","Plat"],a:2,exp:"Obtus."},
{cat:"Mathématiques",q:"Deux angles complémentaires font :",opts:["90°","180°","270°","360°"],a:0,exp:"90°."},

/* ============================================================
   LOGIQUE DU QUIZ
   ============================================================ */
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let wrongCount = 0;
let answered = 0;
let selectedOption = null;
let answeredState = false;

const CATEGORIES = {
  "Mathématiques": "📐",
  "Sciences": "🔬",
  "Français": "📖"
};

function initSections(){
  const grid = document.getElementById('sectionsGrid');
  const counts = {};
  QUESTIONS.forEach(q => { counts[q.cat] = (counts[q.cat]||0)+1; });
  let html = '';
  Object.keys(counts).forEach(cat => {
    html += `<div class="section-card" onclick="startQuiz('${cat}')">
      <div class="icon">${CATEGORIES[cat]||'📖'}</div>
      <div class="name">${cat}</div>
      <div class="count">${counts[cat]} questions</div>
    </div>`;
  });
  grid.innerHTML = html;
  document.getElementById('statTotal').textContent = QUESTIONS.length;
}

function startQuiz(mode){
  if(mode === 'all'){
    currentQuestions = [...QUESTIONS];
  } else if(mode === 'random'){
    currentQuestions = shuffle([...QUESTIONS]).slice(0,50);
  } else {
    currentQuestions = QUESTIONS.filter(q => q.cat === mode);
  }
  currentIndex = 0;
  score = 0;
  wrongCount = 0;
  answered = 0;
  selectedOption = null;
  answeredState = false;
  document.querySelectorAll('.section-card').forEach(c => c.classList.remove('active'));
  renderQuestion();
  updateStats();
}

function shuffle(arr){
  for(let i = arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function renderQuestion(){
  const area = document.getElementById('quizArea');
  area.classList.add('active');
  if(currentIndex >= currentQuestions.length){
    renderResult();
    return;
  }
  const q = currentQuestions[currentIndex];
  const letters = ['A','B','C','D'];
  let optsHtml = '';
  q.opts.forEach((opt,i) => {
    optsHtml += `<div class="option" data-idx="${i}" onclick="selectOption(${i})">
      <span class="letter">${letters[i]}</span>
      <span>${opt}</span>
    </div>`;
  });

  area.innerHTML = `
    <div class="question-card">
      <div class="q-header">
        <span class="q-num">Question ${currentIndex+1} / ${currentQuestions.length}</span>
        <span class="q-tag">${CATEGORIES[q.cat]||'📖'} ${q.cat}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="optionsBox">${optsHtml}</div>
      <div class="explanation" id="explanation">💡 <strong>Explication :</strong> ${q.exp}</div>
      <div class="nav-buttons">
        <button class="btn btn-outline" onclick="prevQuestion()" ${currentIndex===0?'disabled style="opacity:.4"':''}>⬅️ Précédent</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Suivant ➡️</button>
      </div>
    </div>
  `;
  selectedOption = null;
  answeredState = false;
  updateProgress();
}

function selectOption(idx){
  if(answeredState) return;
  const q = currentQuestions[currentIndex];
  const options = document.querySelectorAll('#optionsBox .option');
  options.forEach(o => o.classList.remove('selected','correct','wrong'));
  options[idx].classList.add('selected');
  selectedOption = idx;
  answeredState = true;
  answered++;
  if(idx === q.a){
    options[idx].classList.add('correct');
    score++;
  } else {
    options[idx].classList.add('wrong');
    options[q.a].classList.add('correct');
    wrongCount++;
  }
  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').textContent = currentIndex === currentQuestions.length-1 ? '🏁 Voir le résultat' : 'Suivant ➡️';
  updateStats();
}

function nextQuestion(){
  currentIndex++;
  renderQuestion();
}

function prevQuestion(){
  if(currentIndex > 0){
    currentIndex--;
    renderQuestion();
  }
}

function updateProgress(){
  const total = currentQuestions.length;
  const pct = total ? (answered/total)*100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${answered} / ${total}`;
}

function updateStats(){
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = wrongCount;
  updateProgress();
}

function renderResult(){
  const area = document.getElementById('quizArea');
  const total = currentQuestions.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  let msg = '', sub = '';
  if(pct >= 90){ msg = '🏆 Excellent !'; sub = 'Vous êtes prêt(e) pour le concours'; }
  else if(pct >= 75){ msg = '🌟 Très bien'; sub = 'Niveau avancé, continuez'; }
  else if(pct >= 60){ msg = '👍 Bien'; sub = 'Révisez certains chapitres'; }
  else if(pct >= 40){ msg = '📖 Moyen'; sub = 'Révisez soigneusement'; }
  else { msg = '💪 À travailler'; sub = 'Reprenez le cours depuis le début'; }

  area.innerHTML = `
    <div class="result-card">
      <div class="result-circle" style="background:conic-gradient(var(--primary) ${pct*3.6}deg, #e8eef6 0deg);">
        <div class="pct">${pct}%</div>
        <div class="pct-lbl">Score</div>
      </div>
      <div class="result-msg">${msg}</div>
      <div class="result-sub">${sub}</div>
      <div class="stats" style="margin:22px 0;">
        <div class="stat-card"><span class="num" style="color:var(--success)">${score}</span><span class="lbl">Correctes</span></div>
        <div class="stat-card"><span class="num" style="color:var(--error)">${wrongCount}</span><span class="lbl">Fausses</span></div>
        <div class="stat-card"><span class="num">${total}</span><span class="lbl">Total</span></div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" onclick="startQuiz('all')">🔁 Refaire</button>
        <button class="btn btn-accent" onclick="startQuiz('random')">🎲 Quiz aléatoire</button>
      </div>
    </div>
  `;
}

function resetQuiz(){
  currentQuestions = [];
  currentIndex = 0;
  score = 0;
  wrongCount = 0;
  answered = 0;
  document.getElementById('quizArea').classList.remove('active');
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = '0 / 0';
  document.getElementById('statAnswered').textContent = '0';
  document.getElementById('statCorrect').textContent = '0';
  document.getElementById('statWrong').textContent = '0';
  document.querySelectorAll('.section-card').forEach(c => c.classList.remove('active'));
}

initSections();
</script>
